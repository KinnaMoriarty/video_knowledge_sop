<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2400" viewBox="0 0 1200 2400" role="img" aria-labelledby="title desc">
  <title id="title">AI 视频生产 Skill SOP 知识工程系统长图</title>
  <desc id="desc">展示从输入来源、前端工作台、后端 API、Stage1 案例优先、Stage2 RU 分发、六大角色知识库到最终产出的系统作品集长图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071327"/>
      <stop offset="48%" stop-color="#0b1638"/>
      <stop offset="100%" stop-color="#120b2f"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38e8ff"/>
      <stop offset="100%" stop-color="#6c7cff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a7cff"/>
      <stop offset="100%" stop-color="#ff71d7"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4dffca"/>
      <stop offset="100%" stop-color="#35a8ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: url(#bg); }
      .card { fill: rgba(16, 31, 68, 0.78); stroke: rgba(93, 222, 255, 0.55); stroke-width: 1.5; rx: 24; }
      .card2 { fill: rgba(30, 20, 72, 0.78); stroke: rgba(165, 124, 255, 0.55); stroke-width: 1.5; rx: 24; }
      .title { fill: #f4fbff; font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; font-size: 58px; font-weight: 800; letter-spacing: 1px; }
      .subtitle { fill: #9edfff; font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; font-size: 23px; font-weight: 500; }
      .section { fill: #7feaff; font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; font-size: 32px; font-weight: 800; }
      .sectionV { fill: #bd9cff; font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; font-size: 32px; font-weight: 800; }
      .h { fill: #f4fbff; font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; font-size: 25px; font-weight: 800; }
      .p { fill: #c5d8f5; font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; font-size: 18px; font-weight: 500; }
      .small { fill: #90a8ce; font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; font-size: 15px; font-weight: 500; }
      .num { fill: #dffbff; font-family: Arial, sans-serif; font-size: 30px; font-weight: 800; }
      .line { stroke: #4ddfff; stroke-width: 2; opacity: .72; fill: none; marker-end: url(#arrow); }
      .lineV { stroke: #a985ff; stroke-width: 2; opacity: .72; fill: none; marker-end: url(#arrowV); }
      .chip { fill: rgba(6, 22, 48, .8); stroke: rgba(126, 234, 255, .5); rx: 18; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#4ddfff"/>
    </marker>
    <marker id="arrowV" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#a985ff"/>
    </marker>
